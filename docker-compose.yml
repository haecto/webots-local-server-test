services:
  simulation-server:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive

        RUN apt-get update && apt-get install -y \
          python3.10 \
          python3.10-venv \
          python3-pip \
          git \
          curl \
          docker.io \
          && rm -rf /var/lib/apt/lists/*

        WORKDIR /webots-server

        RUN git clone https://github.com/cyberbotics/webots-server.git . && \
          python3 -m venv /webots-server/.venv && \
          /webots-server/.venv/bin/pip install --upgrade pip && \
          /webots-server/.venv/bin/pip install \
            nvidia-ml-py3 requests psutil tornado distro websockets

        RUN sed -i "s|https://git@github.com/|https://github.com/|g" simulation_server.py

        EXPOSE 2000

        CMD ["bash", "-c", "source /webots-server/.venv/bin/activate && python3 /webots-server/simulation_server.py /config/simulation.json"]

    runtime: nvidia

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    ports:
      - "2000:2000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - webots_projects:/projects
      - webots_logs:/logs
      - ./config/simulation.json:/config/simulation.json:ro

    environment:
      - DEBUG=${DEBUG:-false}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DISPLAY=
      - QT_QPA_PLATFORM=offscreen
      - WEBOTS_HOME=/usr/local/webots

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/load"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  webots_projects:
    driver: local
  webots_logs:
    driver: local
